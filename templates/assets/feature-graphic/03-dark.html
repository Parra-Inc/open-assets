<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024" />
    <link rel="stylesheet" href="../styles.css" />
    <style>body { width: 1024px; height: 500px; }</style>
  </head>
  <body>
    <div class="canvas bg-night" style="width:1024px;height:500px;display:flex;align-items:center;padding:0 64px;gap:40px">
      <div class="glow" style="width:420px;height:420px;background:#4f46e5;top:-140px;right:-60px"></div>
      <div style="position:relative;flex:1">
        <span class="pill" style="background:rgba(255,255,255,.12);font-size:15px">New in 2.0</span>
        <h1 class="headline" style="font-size:54px;margin-top:18px">Focus mode<br />is here.</h1>
      </div>
      <div class="ui-card" style="position:relative;width:360px;background:#161d33;border-color:#273049;color:#e2e8f0;padding:26px">
        <div class="ui-label">Focus today</div>
        <div class="ui-stat" style="font-size:48px">4h 20m</div>
        <div class="bars" style="margin-top:16px;height:110px"><span style="height:40%"></span><span style="height:65%"></span><span style="height:52%"></span><span style="height:88%"></span><span style="height:70%"></span><span style="height:95%"></span></div>
      </div>
    </div>
  </body>
</html>
