<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440, initial-scale=1" />
    <link rel="stylesheet" href="../../dist/styles.css" />
    <link rel="stylesheet" href="_shared.css" />
  </head>
  <body>
    <div class="frame">
      <div class="blob" style="width: 300px; height: 300px; background: #2BA9DD; top: -40px; right: -80px;"></div>
      <div class="blob" style="width: 260px; height: 260px; background: #6FCBEC; bottom: 200px; left: -70px;"></div>
      <div class="blob" style="width: 180px; height: 180px; background: #2BA9DD; top: 360px; right: 210px;"></div>

      <div class="copy">
        <div class="pill glass">{{s04_pill}}</div>
        <div class="headline">{{s04_h1}}<br/><span class="accent-box">{{s04_acc}}</span></div>
        <div class="subhead">{{s04_sub}}</div>
      </div>

      <div class="device dock" style="width: 334px; bottom: -90px;">
        <img data-locale-img="04_log_water_test"
             src="../../public/screenshots/en/04_log_water_test.png" />
      </div>

      <!-- Magnified UI detail -->
      <div class="zoom" data-locale-bg="04_log_water_test"
           style="left: -6px; top: 488px; transform: rotate(-3deg); background-image: url('../../public/screenshots/en/04_log_water_test.png'); background-position: 8% 30.5%;"></div>
    </div>

    <script>
      // Swap the device screenshot to match the active locale (set by open-assets).
      new MutationObserver(function () {
        var lang = document.documentElement.lang || 'en';
        document.querySelectorAll('[data-locale-img]').forEach(function (img) {
          var name = img.getAttribute('data-locale-img');
          img.src = '../../public/screenshots/' + lang + '/' + name + '.png';
        });
        document.querySelectorAll('[data-locale-bg]').forEach(function (el) {
          var name = el.getAttribute('data-locale-bg');
          el.style.backgroundImage = "url('../../public/screenshots/" + lang + "/" + name + ".png')";
        });
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    </script>
  </body>
</html>
