<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440" />
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>
  <body class="m-0 p-0">
    <div class="screenshot bg-td-gradient flex flex-col items-center" style="height: 978px;">
      <div class="glow-orb w-[200px] h-[200px] bg-td-accent top-[300px] -left-[40px]"></div>
      <div class="glow-orb w-[180px] h-[180px] bg-td-primary top-[500px] right-[-30px]"></div>

      <div class="deco deco-sm deco-faded" style="top: 95px; left: 25px;">🇪🇸</div>
      <div class="deco deco-sm deco-faded" style="top: 200px; right: 35px;">🇮🇹</div>
      <div class="deco deco-sm deco-faded" style="top: 550px; right: 22px;">🐻</div>
      <div class="deco deco-sm deco-faded" style="top: 420px; left: 30px;">🇪🇺</div>
      <div class="deco deco-sm deco-faded" style="top: 700px; left: 55px;">🌵</div>

      <div class="relative z-10 pt-14 pb-2 px-8 text-center">
        <h1 class="headline text-[36px] text-td-fg mb-4">
          {{rules_line1}} <span style="color: var(--color-td-primary);">{{rules_accent}}</span><br/>{{rules_line2}}
        </h1>
        <p class="subheadline text-[15px] px-2">{{rules_sub}}</p>
      </div>

      <div class="relative z-10 mt-4 w-full flex justify-center">
        <div class="relative">
          <div style="transform: perspective(900px) rotateY(-2deg) rotateX(1deg);">
            <div class="phone phone-300">
              <div class="phone-screen">
                <img data-locale-img="08_rules"
                     src="../../public/screenshots-android/en/08_rules.png"
                     style="width: 300px; height: auto; display: block;" />
              </div>
            </div>
          </div>

          <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 50px; right: -55px;">
            <div>
              <div class="text-[11px] font-medium" style="color: #6B8080;">{{rules_callout_label}}</div>
              <div class="text-[17px] font-bold" style="color: #1A8A7D;">{{rules_callout_value}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      new MutationObserver(function() {
        var lang = document.documentElement.lang || 'en';
        document.querySelectorAll('[data-locale-img]').forEach(function(img) {
          var name = img.getAttribute('data-locale-img');
          img.src = '../../public/screenshots-android/' + lang + '/' + name + '.png';
        });
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    </script>
  </body>
</html>
