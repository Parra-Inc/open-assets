<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440, initial-scale=1" />
    <link rel="stylesheet" href="../../dist/styles.css" />
    <link rel="stylesheet" href="_shared.css" />
  </head>
  <body>
    <div class="frame">
      <div class="blob" style="width: 300px; height: 300px; background: #2BA9DD; top: -60px; left: -60px;"></div>
      <div class="blob" style="width: 280px; height: 280px; background: #2BA9DD; bottom: 120px; right: -90px;"></div>
      <div class="blob" style="width: 190px; height: 190px; background: #F4B23E; top: 420px; left: 200px; opacity: 0.28;"></div>

      <div class="copy">
        <div class="pill glass">{{s08_pill}}</div>
        <div class="headline">{{s08_h1}}<br/><span class="accent-box">{{s08_acc}}</span></div>
        <div class="subhead">{{s08_sub}}</div>
      </div>

      <div class="device dock" style="width: 334px; bottom: -90px;">
        <img data-locale-img="08_pdf_export"
             src="../../public/screenshots/en/08_pdf_export.png" />
      </div>

      <!-- Magnified UI detail -->
      <div class="zoom" data-locale-bg="08_pdf_export"
           style="right: -6px; top: 540px; transform: rotate(3deg); background-image: url('../../public/screenshots/en/08_pdf_export.png'); background-size: 300% auto; background-position: 76% 33.5%;"></div>
      <div class="cta">{{cta_button}}</div>
    </div>

    <script>
      // Swap the device screenshot to match the active locale (set by open-assets).
      new MutationObserver(function () {
        var lang = document.documentElement.lang || 'en';
        document.querySelectorAll('[data-locale-img]').forEach(function (img) {
          var name = img.getAttribute('data-locale-img');
          img.src = '../../public/screenshots/' + lang + '/' + name + '.png';
        });
        document.querySelectorAll('[data-locale-bg]').forEach(function (el) {
          var name = el.getAttribute('data-locale-bg');
          el.style.backgroundImage = "url('../../public/screenshots/" + lang + "/" + name + ".png')";
        });
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    </script>
  </body>
</html>
