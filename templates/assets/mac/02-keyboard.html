<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440" />
    <link rel="stylesheet" href="../styles.css" />
    <style>body { width: 1440px; height: 900px; }</style>
  </head>
  <body>
    <div class="canvas bg-paper" style="width:1440px;height:900px;display:flex;align-items:center;padding:0 90px;gap:60px">
      <div class="glow" style="width:520px;height:520px;background:#c7d2fe;bottom:-200px;left:-120px"></div>
      <div style="position:relative;width:420px;flex:none">
        <div class="mark" style="width:84px;height:84px;margin-bottom:28px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3.5 3.5M15.5 15.5 19 19M19 5l-3.5 3.5M8.5 15.5 5 19"/></svg></div>
        <h1 class="headline" style="font-size:60px">Keyboard<br /><span style="color:var(--brand)">first.</span></h1>
        <p class="sub" style="font-size:22px;margin-top:20px">Add, move and finish tasks without touching the trackpad.</p>
      </div>
      <div class="mac" style="position:relative;flex:1"><div class="lid" style="width:820px;height:530px"><div class="screen"><div class="ui"><div class="ui-side"><div class="item on">Today</div><div class="item">Projects</div><div class="item">Insights</div><div class="item">Archive</div><div class="item">Settings</div></div><div class="ui-main"><div class="ui-title">Good morning</div><div class="ui-grid"><div class="ui-card"><div class="ui-label">Streak</div><div class="ui-stat">12 days</div></div><div class="ui-card"><div class="ui-label">Focus</div><div class="ui-stat">4h 20m</div></div><div class="ui-card"><div class="ui-label">Done</div><div class="ui-stat">38</div></div></div><div class="ui-card"><div class="ui-label">This week</div><div class="bars"><span style="height:40%"></span><span style="height:65%"></span><span style="height:52%"></span><span style="height:88%"></span><span style="height:70%"></span><span style="height:95%"></span><span style="height:60%"></span></div></div><div class="ui-card"><div class="ui-row"><span class="ui-dot" style="background:#4f46e5"></span><b>Draft launch post</b></div><div class="ui-row"><span class="ui-dot" style="background:#06b6d4"></span><b>Review screenshots</b></div><div class="ui-row"><span class="ui-dot" style="background:#f59e0b"></span><b>Ship 2.0 to TestFlight</b></div><div class="ui-row"><span class="ui-dot" style="background:#10b981"></span><b>Reply to reviews</b></div></div></div></div></div></div><div class="base" style="width:900px"></div></div>
    </div>
  </body>
</html>
