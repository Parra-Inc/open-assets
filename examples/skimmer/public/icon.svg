<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="74%"><stop offset="0%" stop-color="#FEFFFF"/><stop offset="100%" stop-color="#E4EFF5"/></radialGradient>
    <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CFE9F5"/><stop offset="100%" stop-color="#A9D6EA"/></linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EDF4F8"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#BFDFEF" stop-opacity="0"/><stop offset="90%" stop-color="#8FC3DA" stop-opacity="1"/></linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FB8BA6"/><stop offset="100%" stop-color="#EB5A7F"/></linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBC65F"/><stop offset="100%" stop-color="#EEA221"/></linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#35CBB7"/><stop offset="100%" stop-color="#0FA695"/></linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#51BFEB"/><stop offset="100%" stop-color="#1D98CF"/></linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="sh" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="air"><rect x="0" y="0" width="1024" height="580"/></clipPath>
    <clipPath id="wtr"><rect x="0" y="580" width="1024" height="444"/></clipPath>
  </defs>

  <!-- Background (air) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Water -->
  <rect y="580" width="1024" height="444" fill="url(#waterG)"/>

  <!-- Reflection -->
  <g clip-path="url(#wtr)">
    <g transform="translate(0 1160) scale(1 -1)" opacity="0.28">
      <path d="M 402 580 L 402 196 Q 402 150 448 150 L 576 150 Q 622 150 622 196 L 622 580 Z" fill="url(#strip)"/>
      <rect x="432" y="184" width="160" height="82" rx="20" fill="url(#pk)"/>
      <rect x="432" y="284" width="160" height="82" rx="20" fill="url(#am)"/>
      <rect x="432" y="384" width="160" height="82" rx="20" fill="url(#tl)"/>
      <rect x="432" y="484" width="160" height="82" rx="20" fill="url(#bl)"/>
    </g>
    <rect y="580" width="1024" height="444" fill="url(#fade)"/>
  </g>

  <!-- Colored halos -->
  <g clip-path="url(#air)"><g filter="url(#glow)" opacity="0.5">
    <ellipse cx="512" cy="225" rx="160" ry="66" fill="#F26D8D"/>
    <ellipse cx="512" cy="325" rx="160" ry="66" fill="#F4B23E"/>
    <ellipse cx="512" cy="425" rx="160" ry="66" fill="#16B8A6"/>
    <ellipse cx="512" cy="525" rx="160" ry="66" fill="#2BA9DD"/>
  </g></g>

  <!-- Strip: rounded top, square bottom flush at the waterline -->
  <path d="M 402 592 L 402 208 Q 402 162 448 162 L 576 162 Q 622 162 622 208 L 622 592 Z" fill="#8AA6B6" opacity="0.28" filter="url(#sh)"/>
  <path d="M 402 580 L 402 196 Q 402 150 448 150 L 576 150 Q 622 150 622 196 L 622 580 Z" fill="url(#strip)" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="432" y="184" width="160" height="82" rx="20" fill="url(#pk)"/>
  <rect x="432" y="284" width="160" height="82" rx="20" fill="url(#am)"/>
  <rect x="432" y="384" width="160" height="82" rx="20" fill="url(#tl)"/>
  <rect x="432" y="484" width="160" height="82" rx="20" fill="url(#bl)"/>
  <g fill="#FFFFFF" opacity="0.30">
    <rect x="444" y="194" width="136" height="20" rx="10"/>
    <rect x="444" y="294" width="136" height="20" rx="10"/>
    <rect x="444" y="394" width="136" height="20" rx="10"/>
    <rect x="444" y="494" width="136" height="20" rx="10"/>
  </g>

  <!-- Straight waterline, drawn over the strip -->
  <rect y="576" width="1024" height="5" fill="#F1FAFD" opacity="0.65"/>
  <rect y="581" width="1024" height="2" fill="#8FC3DA" opacity="0.25"/>
</svg>
