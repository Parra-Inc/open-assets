<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440" />
    <link rel="stylesheet" href="../../dist/styles.css" />
    <style>
      .co-ico { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .co-lbl { font-size: 11px; font-weight: 600; color: #8A7F76; line-height: 1.1; }
      .co-val { font-size: 15px; font-weight: 700; color: #2C2522; line-height: 1.15; }
    </style>
  </head>
  <body class="m-0 p-0">
    <div class="screenshot bg-tf-gradient flex flex-col items-center">
      <div class="glow-orb w-[260px] h-[260px] bg-tf-primary top-[110px] -left-[80px]"></div>
      <div class="glow-orb w-[200px] h-[200px] bg-tf-coral top-[360px] right-[-60px]"></div>
      <div class="glow-orb w-[170px] h-[170px] bg-tf-primary top-[640px] left-[40px]"></div>

      <span class="flare flare-sparkle" style="top: 92px; left: 36px; width: 14px; height: 14px; color: #CCAA6C; opacity: 0.22; transform: rotate(20deg);"></span>
      <span class="flare flare-heart" style="top: 178px; right: 32px; font-size: 17px; color: #D4867F; opacity: 0.20; transform: rotate(12deg);">&#9829;</span>
      <span class="flare flare-dot" style="top: 140px; left: 80px; width: 6px; height: 6px; color: #CCAA6C; opacity: 0.22;"></span>

      <div class="relative z-10 px-9 text-center" style="padding-top: 46px; height: 262px;">
        <div class="pill pill-gold mx-auto mb-4">
          <span>&#127873;</span>
          <span>A memory of every gift</span>
        </div>
        <h1 class="headline text-[34px]">
          Never give the same<br/>
          gift <span class="headline-gold">twice</span>.
        </h1>
        <p class="subheadline text-[14px] px-2 mt-3">
          Every gift you have given, logged by<br/>person, occasion, and year.
        </p>
      </div>

      <div class="relative z-10" style="transform: perspective(900px) rotateY(-2deg) rotateX(1deg);">
        <div class="phone phone-300">
          <div class="phone-screen">
            <img src="../../public/screenshots/06_gifts.png" style="width: 300px; height: auto; display: block;" />
          </div>
        </div>
      </div>

      <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 356px; left: -4px;">
        <div class="co-ico" style="background: rgba(204,170,108,0.16);"><span style="font-size:16px;">&#128367;&#65039;</span></div>
        <div><div class="co-lbl">Already given</div><div class="co-val">Candle &middot; last year</div></div>
      </div>
    </div>
  </body>
</html>
