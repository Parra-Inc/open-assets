<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440" />
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>
  <body class="m-0 p-0">
    <div class="screenshot bg-td-gradient flex flex-col items-center" style="height: 978px;">
      <div class="glow-orb w-[240px] h-[240px] bg-td-accent top-[200px] right-[-50px]"></div>

      <div class="deco deco-lg deco-faded" style="top: 40px; left: 30px;">🇪🇺</div>
      <div class="deco deco-sm deco-faded" style="top: 120px; right: 30px;">🇫🇷</div>
      <div class="deco deco-sm deco-faded" style="top: 620px; left: 22px;">🇳🇱</div>
      <div class="deco deco-sm deco-faded" style="top: 500px; right: 25px;">🇪🇸</div>
      <div class="deco deco-sm deco-faded" style="top: 350px; left: 15px;">🇮🇹</div>
      <div class="deco deco-sm deco-faded" style="top: 700px; right: 45px;">🇵🇹</div>

      <div class="relative z-10 pt-14 pb-2 px-8 text-center">
        <h1 class="headline text-[36px] text-td-fg mb-4">
          {{schen_line1}}<br/>{{schen_line2}} <span style="color: var(--color-td-accent);">{{schen_accent}}</span> {{schen_line3}}
        </h1>
        <p class="subheadline text-[15px] px-2">{{schen_sub}}</p>
      </div>

      <div class="relative z-10 mt-4 w-full flex justify-center">
        <div class="relative">
          <div style="transform: perspective(900px) rotateY(-1deg) rotateX(1deg);">
            <div class="phone phone-300">
              <div class="phone-screen">
                <img data-locale-img="05_schengen"
                     src="../../public/screenshots-android/en/05_schengen.png"
                     style="width: 300px; height: auto; display: block;" />
              </div>
            </div>
          </div>

          <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 40px; left: -55px;">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background: rgba(212, 100, 92, 0.12);">
              <span class="text-[16px]">⚠️</span>
            </div>
            <div>
              <div class="text-[11px] font-medium" style="color: #6B8080;">{{schen_days_label}}</div>
              <div class="text-[17px] font-bold" style="color: #D4645C;">{{schen_days_value}}</div>
            </div>
          </div>

          <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 200px; right: -50px;">
            <div>
              <div class="text-[11px] font-medium" style="color: #6B8080;">{{schen_status_label}}</div>
              <div class="text-[17px] font-bold" style="color: #D4645C;">{{schen_status_value}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      new MutationObserver(function() {
        var lang = document.documentElement.lang || 'en';
        document.querySelectorAll('[data-locale-img]').forEach(function(img) {
          var name = img.getAttribute('data-locale-img');
          img.src = '../../public/screenshots-android/' + lang + '/' + name + '.png';
        });
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    </script>
  </body>
</html>
