<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024" />
    <link rel="stylesheet" href="../styles.css" />
    <style>body { width: 1024px; height: 500px; }</style>
  </head>
  <body>
    <div class="canvas bg-paper" style="width:1024px;height:500px;display:flex;align-items:center">
      <div class="glow" style="width:380px;height:380px;background:#c7d2fe;top:-100px;left:-120px"></div>
      <div style="position:relative;padding-left:64px;width:470px">
        <div class="mark" style="width:72px;height:72px;margin-bottom:22px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3.5 3.5M15.5 15.5 19 19M19 5l-3.5 3.5M8.5 15.5 5 19"/></svg></div>
        <h1 class="headline" style="font-size:50px">Your day,<br /><span style="color:var(--brand)">in focus.</span></h1>
        <p class="sub" style="font-size:20px;margin-top:14px;color:var(--muted)">Tasks, streaks and focus time in one calm app.</p>
      </div>
      <div class="phone" style="position:absolute;right:70px;top:46px;width:250px;height:520px;transform:rotate(6deg)"><div class="screen"><div class="ui"><div class="ui-side"><div class="item on">Today</div><div class="item">Projects</div><div class="item">Insights</div><div class="item">Archive</div><div class="item">Settings</div></div><div class="ui-main"><div class="ui-title">Good morning</div><div class="ui-grid"><div class="ui-card"><div class="ui-label">Streak</div><div class="ui-stat">12 days</div></div><div class="ui-card"><div class="ui-label">Focus</div><div class="ui-stat">4h 20m</div></div><div class="ui-card"><div class="ui-label">Done</div><div class="ui-stat">38</div></div></div><div class="ui-card"><div class="ui-label">This week</div><div class="bars"><span style="height:40%"></span><span style="height:65%"></span><span style="height:52%"></span><span style="height:88%"></span><span style="height:70%"></span><span style="height:95%"></span><span style="height:60%"></span></div></div><div class="ui-card"><div class="ui-row"><span class="ui-dot" style="background:#4f46e5"></span><b>Draft launch post</b></div><div class="ui-row"><span class="ui-dot" style="background:#06b6d4"></span><b>Review screenshots</b></div><div class="ui-row"><span class="ui-dot" style="background:#f59e0b"></span><b>Ship 2.0 to TestFlight</b></div><div class="ui-row"><span class="ui-dot" style="background:#10b981"></span><b>Reply to reviews</b></div></div></div></div></div></div>
    </div>
  </body>
</html>
