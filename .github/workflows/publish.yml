name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; not every Node 24 image ships it.
      - run: npm install -g npm@latest

      # Ubuntu 23.10+ blocks the unprivileged user namespaces Chromium's
      # sandbox needs; the real-browser tests abort (signal 6) without this.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm install
      # npm@latest may skip Puppeteer's install script; fetch Chrome explicitly.
      - run: npx puppeteer browsers install chrome
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish
