<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440" />
    <link rel="stylesheet" href="../../dist/styles.css" />
    <style>
      .co-ico { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .co-lbl { font-size: 11px; font-weight: 600; color: #8A7F76; line-height: 1.1; }
      .co-val { font-size: 15px; font-weight: 700; color: #2C2522; line-height: 1.15; }
    </style>
  </head>
  <body class="m-0 p-0">
    <div class="screenshot bg-tf-gradient flex flex-col items-center">
      <div class="glow-orb w-[260px] h-[260px] bg-tf-coral top-[110px] -left-[80px]"></div>
      <div class="glow-orb w-[200px] h-[200px] bg-tf-primary top-[360px] right-[-60px]"></div>
      <div class="glow-orb w-[170px] h-[170px] bg-tf-coral top-[640px] left-[40px]"></div>

      <span class="flare flare-heart" style="top: 92px; left: 32px; font-size: 22px; color: #D4867F; opacity: 0.22; transform: rotate(-16deg);">&#9829;</span>
      <span class="flare flare-dot" style="top: 168px; right: 42px; width: 6px; height: 6px; color: #CCAA6C; opacity: 0.20;"></span>
      <span class="flare flare-sparkle" style="top: 130px; right: 68px; width: 12px; height: 12px; color: #D4867F; opacity: 0.18; transform: rotate(45deg);"></span>

      <div class="relative z-10 px-9 text-center" style="padding-top: 46px; height: 262px;">
        <div class="pill pill-coral mx-auto mb-4">
          <span>&#128156;</span>
          <span>Don't let it drift</span>
        </div>
        <h1 class="headline text-[34px]">
          Know who you<br/>
          <span class="headline-coral">haven't called</span>.
        </h1>
        <p class="subheadline text-[14px] px-2 mt-3">
          Contact streaks surface the friendships<br/>quietly slipping, before they do.
        </p>
      </div>

      <div class="relative z-10" style="transform: perspective(900px) rotateY(-2deg) rotateX(1deg);">
        <div class="phone phone-300">
          <div class="phone-screen">
            <img src="../../public/screenshots/03_person_overview.png" style="width: 300px; height: auto; display: block;" />
          </div>
        </div>
      </div>

      <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 330px; right: -4px;">
        <div class="co-ico" style="background: rgba(123,174,127,0.18);"><span style="font-size:16px;">&#128994;</span></div>
        <div><div class="co-lbl">In touch</div><div class="co-val">Mom &middot; 2 days ago</div></div>
      </div>
      <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 624px; left: -4px;">
        <div class="co-ico" style="background: rgba(212,164,74,0.20);"><span style="font-size:16px;">&#9888;&#65039;</span></div>
        <div><div class="co-lbl">Overdue</div><div class="co-val">Aunt Lou &middot; 3 months</div></div>
      </div>
    </div>
  </body>
</html>
