<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440" />
    <link rel="stylesheet" href="../../dist/styles.css" />
  </head>
  <body class="m-0 p-0">
    <div class="screenshot bg-td-gradient flex flex-col items-center">
      <!-- Ambient glow -->
      <div class="glow-orb w-[220px] h-[220px] bg-td-danger top-[280px] right-[-40px]"></div>

      <!-- Scattered decorative emoji -->
      <div class="deco deco-sm deco-faded" style="top: 75px; left: 30px;">🔔</div>
      <div class="deco deco-sm deco-faded" style="top: 580px; right: 25px;">🛡️</div>
      <div class="deco deco-sm deco-faded" style="top: 130px; right: 50px;">🇬🇧</div>
      <div class="deco deco-sm deco-faded" style="top: 460px; left: 20px;">🌴</div>

      <!-- Marketing text -->
      <div class="relative z-10 pt-14 pb-2 px-8 text-center">
        <h1 class="headline text-[36px] text-td-fg mb-4">
          {{notif_line1}}<br/>{{notif_line2}} <span style="color: var(--color-td-danger);">{{notif_accent}}</span> {{notif_line3}}
        </h1>
        <p class="subheadline text-[15px] px-2">
          {{notif_sub}}
        </p>
      </div>

      <!-- Phone + floating callouts -->
      <div class="relative z-10 mt-4 w-full flex justify-center">
        <div class="relative">
          <div style="transform: perspective(900px) rotateY(2deg) rotateX(1deg);">
            <div class="phone phone-300">
              <div class="phone-screen">
                <img data-locale-img="06_notifications"
                     src="../../public/screenshots/en/06_notifications.png"
                     style="width: 300px; height: auto; display: block;" />
              </div>
            </div>
          </div>

          <!-- Floating callout: Alert timing -->
          <div class="callout flex items-center gap-2.5 absolute z-20" style="top: 40px; left: -55px;">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background: rgba(212, 100, 92, 0.12);">
              <span class="text-[16px]">⏰</span>
            </div>
            <div>
              <div class="text-[11px] font-medium" style="color: #6B8080;">{{notif_alert_label}}</div>
              <div class="text-[17px] font-bold" style="color: #D4645C;">{{notif_alert_value}}</div>
            </div>
          </div>

          <!-- Floating callout: Protected -->
          <div class="callout flex items-center gap-2.5 absolute z-20" style="bottom: 140px; right: -50px;">
            <div>
              <div class="text-[11px] font-medium" style="color: #6B8080;">{{notif_protected_label}}</div>
              <div class="text-[17px] font-bold" style="color: #4CAF7D;">{{notif_protected_value}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      new MutationObserver(function() {
        var lang = document.documentElement.lang || 'en';
        document.querySelectorAll('[data-locale-img]').forEach(function(img) {
          var name = img.getAttribute('data-locale-img');
          img.src = '../../public/screenshots/' + lang + '/' + name + '.png';
        });
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    </script>
  </body>
</html>
